<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form th:action="@{/exbbs/post}" method="post">
		名前：
		<input type="text" name="name">
		<br>
		記事：
		<br>
		<textarea name="content" rows="4" cols="40"></textarea>
		<br>
		<button>投稿！</button>
	</form>
	<hr>
	<div th:each="user:${articleList}">
		投稿者名：<span th:text="${user.name}"></span>
		<br>
        投稿内容：<br>
		<span th:text="${user.content}"></span>
	<hr>
	</div>
</body>
</html>
